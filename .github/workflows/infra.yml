name: Deploy Infrastructure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "infrastructure/app-infrastructure/**"

env:
  AWS_REGION: "sa-east-1"
  TERRAFORM_VERSION: "1.5.0"
  WORKING_DIR_INFRA: "./infrastructure/app-infrastructure"

permissions:
  id-token: write
  contents: read

jobs:
  terraform-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1.7.0
        with:
          role-to-assume: "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE_TO_ASSUME_NAME }}"
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR_INFRA }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=app/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=${{ secrets.TERRAFORM_LOCK_TABLE }}"
      
      - name: Terraform Plan
        working-directory: ${{ env.WORKING_DIR_INFRA }}
        run: |
          terraform plan \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="db_name=${{ secrets.DB_NAME }}" \
            -var="db_username=${{ secrets.DB_USERNAME }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}"

      - name: Terraform Apply
        working-directory: ${{ env.WORKING_DIR_INFRA }}
        run: terraform apply -auto-approve

      - name: Upload Terraform Outputs
        id: outputs
        working-directory: ${{ env.WORKING_DIR_INFRA }}
        run: |
          terraform output -json > infra-outputs.json
        # Guarda outputs como artifact para que el workflow de aplicación los use
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: infra-outputs
          path: infrastructure/app-infrastructure/infra-outputs.json
